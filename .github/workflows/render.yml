name: Render Kindle Dashboard

on:
  schedule:
    # 每 20 分钟；免费账号实际可能延迟数分钟到一小时
    - cron: "*/20 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "render_dashboard.py"
      - "requirements.txt"
      - ".github/workflows/render.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install fonts + deps
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          pip install -r requirements.txt

      - name: Render dashboard
        env:
          CALENDAR_ICS_URL: ${{ secrets.CALENDAR_ICS_URL }}
          TIMEZONE: Asia/Shanghai
          DAYS_AHEAD: "7"
          DASHBOARD_TITLE: 出门看板
          OUTPUT_PATH: site/dashboard.png
          WEATHER_CITY: 上海
          WEATHER_LAT: "31.2304"
          WEATHER_LON: "121.4737"
        run: |
          if [ -z "$CALENDAR_ICS_URL" ]; then
            echo "请在仓库 Secrets 中设置 CALENDAR_ICS_URL"
            exit 1
          fi
          python render_dashboard.py
          # 同时放一份 index，方便浏览器预览
          cat > site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>Kindle 出门看板</title>
            <style>
              body { margin: 0; background: #111; color: #eee; font-family: system-ui, sans-serif; }
              main { max-width: 640px; margin: 0 auto; padding: 24px; }
              img { width: 100%; height: auto; background: #fff; }
              p { opacity: 0.7; font-size: 14px; }
            </style>
          </head>
          <body>
            <main>
              <h1>Kindle 出门看板</h1>
              <p>Kindle 请直接使用 <code>dashboard.png</code> 地址。</p>
              <img src="./dashboard.png" alt="dashboard" />
            </main>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
